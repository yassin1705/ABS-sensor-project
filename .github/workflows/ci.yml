name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.11 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model_training/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model_training/requirements.txt

      - name: Run diagnostic-platform tests
        run: python -m unittest discover -s diagnostic_platform/tests -p "test_*.py" -v

      - name: Run forecasting and SPC tests
        run: python -m unittest discover -s model_training/tests -p "test_*.py" -v

      - name: Run fault-model pipeline tests
        run: python -m unittest discover -s fault_parameter_training/tests -p "test_*.py" -v

  matlab-tests:
    name: MATLAB simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b

      - name: Run MATLAB tests
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            cd('ABS_SoH_Simulator');
            addpath('core');
            results = runtests('tests');
            assert(all([results.Passed]), 'MATLAB tests failed');
